[workspace]
members = ["crates/dgl-core", "crates/dgl-uniffi", "desktop"]
default-members = ["crates/dgl-core", "crates/dgl-uniffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
uniffi = { version = "=0.32.2", features = ["tokio"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
