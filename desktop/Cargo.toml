[package]
name = "dgl-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
dgl-core = { path = "../crates/dgl-core" }
gpui = "=0.2.2"
alacritty_terminal = "=0.26.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
unicode-segmentation = "=1.13.3"
raw-window-handle = "=0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.5.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "UI_ViewManagement", "Win32_Graphics_Dwm", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Notifications", "Win32_System_Registry"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
zeroize = "=1.9.1"

[build-dependencies]
cc = "=1.10.0"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "=3.27.0"
russh.workspace = true
rand = "=0.10.3"
