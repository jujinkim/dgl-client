[package]
name = "dgl-uniffi"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dgl-core = { path = "../dgl-core" }
uniffi.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["cli"]
