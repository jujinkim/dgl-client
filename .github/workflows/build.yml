name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_windows:
        description: 'Run Windows installer/DPAPI acceptance on a disposable runner'
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/check_prompt.py
      - run: python3 scripts/verify_wrapper.py
      - name: Install Android build platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Install pinned Gitleaks
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks_8.30.1_linux_x64.tar.gz
      - run: python3 scripts/scan_secrets.py
      - run: npm ci --ignore-scripts && npm run bundle && npm audit
        working-directory: web
      - run: git diff --exit-code -- app/src/androidMain/assets
      - run: ./gradlew :app:desktopTest :androidApp:assembleDebug :androidApp:assembleRelease :androidApp:assembleDebugAndroidTest :androidApp:lintDebug :app:prepareThirdPartyNotices writeDependencyInventory
      - run: python3 scripts/verify_test_results.py --mode linux --output artifacts/linux-tests.json
        if: always()
      - run: python3 scripts/verify_lint.py
      - run: python3 scripts/audit_dependencies.py
      - run: python3 scripts/verify_licenses.py
      - run: python3 scripts/collect_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-verification
          path: |
            artifacts/linux-tests.json
            artifacts/dependency-audit.json
            artifacts/build-manifest.json
            artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 7
  windows:
    # Windows acceptance is user-owned; opt in explicitly when automated evidence is wanted.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_windows
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python scripts/verify_wrapper.py
      - name: Install Android build platform
        run: '& "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-36" "build-tools;36.0.0"'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: npm ci --ignore-scripts && npm audit
        working-directory: web
      - run: python -m unittest discover -s scripts/tests -v
      - run: .\gradlew.bat :app:desktopTest :app:prepareDpapiProbe writeDependencyInventory
      - run: python scripts/verify_test_results.py --mode windows --output artifacts/windows-tests.json
        if: always()
      - run: python scripts/audit_dependencies.py
      - run: python scripts/verify_licenses.py
      - run: ./scripts/verify_dpapi_users.ps1
      - run: python scripts/prepare_temurin_source.py
      - run: .\gradlew.bat :app:packageMsi :app:packageExe
      - run: python scripts/verify_windows_installers.py
      - run: python scripts/collect_artifacts.py --platform windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-verification
          path: |
            artifacts/windows-tests.json
            artifacts/windows-dpapi.json
            artifacts/windows-installation.json
            artifacts/windows-build-manifest.json
            artifacts/windows-SHA256SUMS
            artifacts/dependency-audit.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: windows-installers
          path: |
            artifacts/*.msi
            artifacts/*.exe
            artifacts/windows-third-party.zip
            artifacts/windows-build-manifest.json
            artifacts/windows-SHA256SUMS
            artifacts/windows-tests.json
            artifacts/windows-dpapi.json
            artifacts/windows-installation.json
          if-no-files-found: error
          retention-days: 7
  ssh-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        tmux: ['3.3a', '3.7c']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/verify_wrapper.py
      - run: sudo apt-get update && sudo apt-get install -y openssh-server libevent-dev libncurses-dev build-essential
      - run: sudo mkdir -p /run/sshd
      - run: python3 scripts/build_test_tmux.py '${{ matrix.tmux }}'
      - name: Real SSH and tmux tests
        run: python3 scripts/integration.py --tmux '.tools/tmux-${{ matrix.tmux }}/tmux-${{ matrix.tmux }}/tmux'
      - run: python3 scripts/verify_test_results.py --mode ssh --output 'artifacts/tmux-${{ matrix.tmux }}-tests.json'
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tmux-${{ matrix.tmux }}-verification
          path: artifacts/tmux-${{ matrix.tmux }}-tests.json
          if-no-files-found: warn
          retention-days: 7
  android-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.tools/ci-avds
    strategy:
      fail-fast: false
      matrix:
        api: ['34', '35', '36']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/verify_wrapper.py
      - run: sudo apt-get update && sudo apt-get install -y openssh-server libevent-dev libncurses-dev build-essential
      - run: sudo mkdir -p /run/sshd && sudo chmod 666 /dev/kvm
      - name: Prepare dedicated test AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-${{ matrix.api }};google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name "Dgl_API${{ matrix.api }}" --package "system-images;android-${{ matrix.api }};google_apis;x86_64" --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - run: python3 scripts/build_test_tmux.py 3.7c
      - run: python3 scripts/verify_android_matrix.py --apis '${{ matrix.api }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}-result
          path: |
            artifacts/android-matrix-${{ matrix.api }}.json
            artifacts/android-tests-${{ matrix.api }}.json
          if-no-files-found: warn
          retention-days: 7
