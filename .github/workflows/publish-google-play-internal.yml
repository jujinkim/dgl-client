name: Publish DGL internal test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dgl-google-play-internal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: google-play
    env:
      PYTHONUTF8: '1'
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Require main branch
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$GIT_REF" != 'refs/heads/main' ]; then
            echo 'Dispatch internal test releases from main.' >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "Missing release secret: $name" >&2
              exit 1
            fi
          done

      - name: Set up JDK 25 (Gradle daemon; application bytecode targets Java 17)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'

      - name: Install pinned Rust and Android targets
        run: rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Verify wrapper and run unit tests
        run: |
          python3 scripts/verify_wrapper.py
          python3 -m unittest discover -s scripts/tests -v
          cargo test --locked -p dgl-core -p dgl-uniffi

      - name: Prepare terminal assets
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit
          npm run bundle
          npm test
          git diff --exit-code -- ../app/src/androidMain/assets

      - name: Run JVM tests and release lint
        run: |
          ./gradlew --no-daemon :app:desktopTest :androidApp:lintRelease
          python3 scripts/verify_test_results.py --mode linux --output artifacts/play-jvm-tests.json

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dgl-upload.jks"
          test -s "$RUNNER_TEMP/dgl-upload.jks"

      - name: Build signed release AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/dgl-upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :androidApp:bundleRelease

      - name: Verify AAB signature
        run: |
          bundle=androidApp/build/outputs/bundle/release/androidApp-release.aab
          test -s "$bundle"
          verification="$(LC_ALL=C jarsigner -verify "$bundle")"
          if [[ "$verification" != *'jar verified.'* ]]; then
            echo 'Release AAB has no valid JAR signature.' >&2
            exit 1
          fi

      - name: Preserve signed bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dgl-internal-${{ github.run_number }}
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: kim.jujin.dglc
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ github.ref_name }}-${{ github.run_number }}

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/dgl-upload.jks"
