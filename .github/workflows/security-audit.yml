name: Dependency security audit
on:
  schedule:
    - cron: '23 3 * * *' # 12:23 KST (UTC+9)
  workflow_dispatch:
  push:
    branches: [main]
    paths: &audit_paths
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*gradle.lockfile'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew*'
      - 'web/package*.json'
      - 'scripts/audit_dependencies.py'
      - 'scripts/evidence.py'
      - 'scripts/verify_wrapper.py'
      - 'scripts/tests/test_security.py'
      - 'security/dependency-exceptions.json'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [main]
    paths: *audit_paths
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install Android inventory platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - run: python3 scripts/verify_wrapper.py
      - run: python3 -m unittest discover -s scripts/tests -p test_security.py -v
      - name: Resolve Gradle inventory without packaging
        run: ./gradlew writeDependencyInventory
      - name: Audit Maven, Cargo and npm against OSV
        # A failed/missing inventory must still produce a failed audit report.
        if: ${{ always() && !cancelled() }}
        run: python3 scripts/audit_dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-security-audit
          path: |
            artifacts/dependency-inventory.json
            artifacts/dependency-audit.json
          if-no-files-found: error
          retention-days: 14
